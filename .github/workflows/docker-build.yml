name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/**'
      - 'seeds/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: 'Force rebuild base image (slow, ~30min)'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: docker.io
  BASE_IMAGE: luxiasl/dreamgen-base
  MAIN_IMAGE: luxiasl/dreamgen

jobs:
  # ==================== Check if base image needs rebuild ====================
  check-base:
    runs-on: ubuntu-latest
    outputs:
      needs_rebuild: ${{ steps.check.outputs.needs_rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Check if Dockerfile.base changed
        id: check
        run: |
          if [[ "${{ github.event.inputs.rebuild_base }}" == "true" ]]; then
            echo "needs_rebuild=true" >> $GITHUB_OUTPUT
            echo "Force rebuild requested"
          elif git diff --name-only HEAD~1 HEAD | grep -q "docker/Dockerfile.base"; then
            echo "needs_rebuild=true" >> $GITHUB_OUTPUT
            echo "Dockerfile.base changed"
          else
            echo "needs_rebuild=false" >> $GITHUB_OUTPUT
            echo "Dockerfile.base unchanged, skipping base rebuild"
          fi

  # ==================== Build Base Image (only if needed) ====================
  build-base:
    needs: check-base
    if: needs.check-base.outputs.needs_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary tools to free ~10GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "After cleanup:"
          df -h
      
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.base
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:latest
            ${{ env.BASE_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache,mode=max

  # ==================== Build Main Image (always) ====================
  build-main:
    needs: [check-base, build-base]
    # Run even if build-base was skipped
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove unnecessary tools to free ~10-15GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo docker system prune -af
          echo "After cleanup:"
          df -h
      
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push main image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cloud
          push: true
          tags: |
            ${{ env.MAIN_IMAGE }}:latest
            ${{ env.MAIN_IMAGE }}:${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:latest
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.MAIN_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.MAIN_IMAGE }}:buildcache,mode=max
      
      - name: Image digest
        run: |
          echo "### Docker Images Built! 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Main image:** \`${{ env.MAIN_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

