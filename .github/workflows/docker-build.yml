name: Build and Push Docker Images

# Calibration benchmark image only.
# DreamGen runs on dedicated GPU hardware via Heimdall — no Docker needed.

on:
  push:
    branches: [main]
    paths:
      - 'backend/tools/calibration/**'
      - 'calibration/**'
      - 'docker/Dockerfile.calibration'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      rebuild_calibration:
        description: 'Force rebuild Calibration benchmark image'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: docker.io
  CALIBRATION_IMAGE: luxiasl/dreamgen-calibration

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      calibration_changed: ${{ steps.check.outputs.calibration_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check changed files
        id: check
        run: |
          if [[ "${{ github.event.inputs.rebuild_calibration }}" == "true" ]]; then
            echo "calibration_changed=true" >> $GITHUB_OUTPUT
            echo "Calibration: Force rebuild requested"
          elif git diff --name-only HEAD~1 HEAD | grep -qE "backend/tools/calibration|calibration/|docker/Dockerfile.calibration"; then
            echo "calibration_changed=true" >> $GITHUB_OUTPUT
            echo "Calibration: Benchmark files changed"
          else
            echo "calibration_changed=false" >> $GITHUB_OUTPUT
            echo "Calibration: No changes"
          fi

  build-calibration:
    needs: check-changes
    if: needs.check-changes.outputs.calibration_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Calibration image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.calibration
          push: true
          tags: |
            ${{ env.CALIBRATION_IMAGE }}:latest
            ${{ env.CALIBRATION_IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CALIBRATION_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.CALIBRATION_IMAGE }}:buildcache,mode=max

      - name: Summary
        run: |
          echo "### Calibration Benchmark Image Built!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.CALIBRATION_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
