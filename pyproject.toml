[project]
name = "dream-gen"
version = "0.1.0"
description = "Living AI Dream Window - A continuously morphing desktop aesthetic experience"
authors = [
    {name = "Luxia", email = "mail.luxia@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
keywords = ["ai", "generative-art", "stable-diffusion", "desktop-widget", "comfyui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    # Core ML dependencies
    # PyTorch is installed via UV index (specified at bottom of file)
    # MUST specify CUDA index - PyPI defaults to CPU-only!
    # Version unpinned - UV fetches latest compatible version
    "torch",
    "torchvision",
    "torchaudio",
    # Note: Triton is Linux-only, added as platform-specific dependency below
    "numpy>=1.24.0",
    "pillow>=10.1.0",
    # AI/ML
    "diffusers>=0.25.0",
    "huggingface-hub>=0.19.0",
    # API communication
    "requests>=2.31.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    # Configuration
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Utilities
    "python-dateutil>=2.8.2",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "psutil",
    # Video encoding/generation
    "av>=12.0.0",                    # H.264 encoding via PyAV/libx264
    "imageio>=2.33.0",
    "imageio-ffmpeg>=0.4.9",
    # Tools for similarity analysis and metrics comparison
    "imagehash>=4.3.1",          # Required for pHash-8 (production encoder)
    "scikit-image>=0.22.0", 
]

[project.optional-dependencies]
cloud = [
    # Cloud mode dependencies (for VPS deployment)
    # websockets is already in main deps
    "msgpack>=1.0.7",  # Efficient binary serialization for state sync
]

dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    
    # Code quality
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    
    # Type stubs
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
    "types-pillow>=10.1.0",
    
    # Embedding computation (for compute_embeddings.py tool)
    "transformers>=4.35.0",
    
    # Word pool expansion (for find_diverse_components.py)
    "nltk>=3.8.0",
]

windows = [
    # Windows-specific dependencies
    "pywin32>=306; platform_system=='Windows'",
    "psutil>=5.9.6; platform_system=='Windows'",
]

linux = [
    # Linux-specific dependencies
    # Triton: Required for torch.compile optimization on Linux
    # (Windows uses different torch.compile backend, doesn't need Triton)
    "triton; platform_system=='Linux'",
]

all = [
    "dream-gen[dev,windows,linux]",
]

[project.urls]
Homepage = "https://github.com/luxia/dream-gen"
Documentation = "https://github.com/luxia/dream-gen/tree/main/docs"
Repository = "https://github.com/luxia/dream-gen"
Issues = "https://github.com/luxia/dream-gen/issues"

[project.scripts]
dream-gen = "backend.main:main"
dream-controller = "backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# PyTorch CUDA Configuration
# CRITICAL: PyTorch on PyPI is CPU-only by default!
# We MUST specify a CUDA index or users will get CPU-only PyTorch
#
# Using cu126 (CUDA 12.6) - modern default for PyTorch 2.8+
# - Supports RTX 20/30/40, GTX 16 series, and some older Maxwell/Pascal GPUs
# - PyTorch 2.8+ removed cu124 support (only cu126, cu128, cu129 available)
#
# For very old GPUs (Maxwell Titan X, etc.), users should manually install cu121
# before running `uv sync`. See docs/INSTALLATION_GUIDE.md for details.

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Force PyTorch packages to use CUDA index (prevents CPU-only installation)
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

