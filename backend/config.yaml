# Dream Window Configuration
# See docs/CONFIG_REFERENCE.md for detailed explanations

# ═══════════════════════════════════════════════════════════════════════════════
# SYSTEM - Infrastructure paths and connections
# ═══════════════════════════════════════════════════════════════════════════════
system:
  comfyui_url: "http://127.0.0.1:8188"   # ComfyUI API endpoint (change port if needed)
  
  # Paths (relative to project root or absolute)
  output_dir: "./output"    # Frames, status files → use fast SSD
  cache_dir: "./cache"      # LRU image cache → persists across runs
  log_dir: "./logs"         # Logs accumulate; consider rotation for long runs
  # Note: seed_dir removed - FreshFrameBuffer generates all bootstrap frames via txt2img
  
  gpu_id: 0                 # CUDA device for VAE (0-indexed). Multi-GPU: dedicate one here
  log_level: "INFO"         # DEBUG=verbose timing | INFO=normal | WARNING=quiet

# ═══════════════════════════════════════════════════════════════════════════════
# GENERATION - Core image generation pipeline
# ═══════════════════════════════════════════════════════════════════════════════
generation:
  # --- Architecture ---
  use_async_orchestrator: true   # true=parallel workers (2x FPS) | false=sequential (safer)
  model: "sd15"                  # "sd15" (compatible) | "flux.1-schnell" (fast, modern GPU)
  mode: "hybrid"                 # "hybrid" (recommended) | "img2img" | "interpolate"
  
  # --- Resolution ---
  # ↑ = more detail, slower, more VRAM | ↓ = faster, less detail
  # Must be divisible by 8. Update Rainmeter skin if changed.
  resolution: [512, 256]         # [width, height]. Common: [512,256], [512,512], [1024,512]
  
  # --- Model Parameters (Flux) ---
  flux:
    steps: 4              # Flux optimized for 4 steps. ↑ = slower, marginal quality gain
    cfg_scale: 1.0        # Flux uses low CFG by design
    sampler: "euler"
    scheduler: "simple"
  
  # --- Model Parameters (SD 1.5 / 2.1) ---
  sd:
    steps: 10             # ↑ = more refined, slower | ↓ = faster, rougher (8-20 typical)
    cfg_scale: 6.0        # ↑ = stronger prompt | ↓ = dreamier, more drift (5-8 typical)
    sampler: "euler"      # "euler" (deterministic) | "euler_a" (adds variation)
    scheduler: "karras"   # "karras" (better detail) | "normal" (standard)
  
  # ═══════════════════════════════════════════════════════════════════════════
  # HYBRID MODE - Keyframe/interpolation pipeline
  # ═══════════════════════════════════════════════════════════════════════════
  hybrid:
    # --- Animation Smoothness ---
    interpolation_frames: 10     # Frames between keyframes via VAE lerp
                                 # ↑ = smoother, longer per cycle | ↓ = choppier, faster evolution
    
    target_interpolation_fps: 3.5  # Display frame rate
                                   # ↑ = faster playback | ↓ = slower, dreamier
                                   # Set based on your GPU's actual decode speed
    
    # --- Drift Rate ---
    keyframe_denoise: 0.2        # img2img strength for keyframes (0.0-1.0)
                                 # 0.1-0.2 = slow evolution | 0.3-0.4 = balanced | 0.5+ = rapid change
    
    # --- Interpolation Performance ---
    interpolation_resolution_divisor: 1   # 1=full res | 2=half res (4x faster, slight blur)
    interpolation_upscale_method: "bilinear"     # "bilinear" | "bicubic" (sharper, slower)
    interpolation_downsample_method: "bicubic"   # "lanczos" (best) | "bicubic" | "bilinear" (fastest)
  
  # --- Legacy img2img mode ---
  img2img:
    denoise: 0.3          # Only used when mode="img2img"
  
  # ═══════════════════════════════════════════════════════════════════════════
  # CACHE SYSTEM - Mode collapse prevention
  # ═══════════════════════════════════════════════════════════════════════════
  cache:
    max_size: 50                      # Cache capacity. ↑ = more injection variety
    similarity_method: "dual_metric"  # ColorHist + pHash (don't change)
    
    # --- Cache Population ---
    population_mode: "selective"      # "selective" (diversity-filtered) | "all" (everything)
    cache_interpolations: true        # Cache midpoint frames for extra diversity
    cache_diversity_logic: "all"      # "all"=strict (both metrics) | "any"=permissive (either)
    
    # --- Color Histogram Thresholds ---
    # Metric range: ~0.8 (identical) to ~2.3 (very different)
    color_histogram:
      bins_per_channel: 32            # Sensitivity. 32 is good balance
      diversity_threshold: 1.92       # Cache if avg < this. ↓ = stricter cache
      dissimilarity_range: [1.18, 2.05]  # Injection candidate zone. Wider = more candidates
      convergence_threshold: 0.15     # Delta to trigger scaled injection. ↓ = more sensitive
      force_cache_threshold: 0.30     # Delta to force injection. ↓ = earlier intervention
    
    # --- Perceptual Hash Thresholds ---
    # Metric range: 0.0 (identical) to 1.0 (completely different)
    phash:
      hash_size: 8                    # 8x8 DCT = 64 bits
      diversity_threshold: 0.80       # Cache if avg < this. ↓ = stricter cache
      dissimilarity_range: [0.68, 0.92]  # Injection candidate zone
      convergence_threshold: 0.08     # ↓ = more sensitive to structural collapse
      force_cache_threshold: 0.15     # ↓ = earlier structural intervention
    
    # --- Detection Logic ---
    injection_logic: "any"            # "any"=OR (sensitive) | "all"=AND (both must trigger)
                                      # Note: opposite of cache_diversity_logic by design
    
    # --- Injection Behavior ---
    injection_mode: "dissimilar"      # Inject different frames to break collapse
    injection_probability: 0.15       # Base random injection chance. ↑ = more variety
    blend_weight: 0.75                # Cache frame influence (0-1). ↑ = stronger intervention
    injection_cooldown: 2             # Min keyframes between cache injections
    seed_injection_cooldown: 2        # Min keyframes between seed injections
    embedding_history_reset: "partial"   # "partial" | "full" | "none" after injection
    embedding_history_keep_recent: 10    # Frames to keep on partial reset
    
    # --- Collapse Detection ---
    collapse_detection: true
    warmup_keyframes: 50              # Frames to establish baseline before detecting
    convergence_mode: "absolute"      # "absolute" (delta) | "percentage"
    log_convergence_stats: true       # Log for threshold calibration
    
    # --- Collapse Detection Horizons ---
    # Longer horizons reduce false positives during template transitions
    collapse_history_size: 100        # Embedding history buffer size
    collapse_detection_window: 50     # Window for convergence comparison
    collapse_baseline_comparison: true  # Compare against baseline (not just early frames)
    
    # --- Adaptive Seed Injection ---
    seed_injection_floor: 0.02        # Min seed probability (2%)
    seed_injection_max: 0.15          # Max seed probability (15%)
    seed_injection_ramp: 50           # Reach max after N cache injections
    seed_injection_boost_threshold: 10     # Boost when cache < N frames
    seed_injection_boost_probability: 0.20 # Bootstrap boost (20%)
    force_seed_injection_frequency: 0.30   # Force seed if >30% recent were cache injections
    blend_seed_injection: true        # Blend seeds with current frame
    seed_blend_weight: 0.85           # Seed influence (0-1). ↑ = more dramatic
    
    # --- Logging ---
    log_diversity_stats: true
    diversity_check_interval: 10
    
    # --- Advanced Monitoring (Phase 2 - not yet implemented) ---
    advanced_monitoring:
      enabled: false
      eviction_strategy: "lru"
      acceptance_logic: "average"
      diversity_matrix_refresh: 50

# ═══════════════════════════════════════════════════════════════════════════════
# DISPLAY - Buffer and output management
# ═══════════════════════════════════════════════════════════════════════════════
display:
  buffer_target_seconds: 30.0   # Target buffer size ("crumple zone")
                                # ↑ = more resilient, longer startup | ↓ = faster startup
  
  min_buffer_seconds: 10.0      # Minimum before playback starts
                                # ↓ = faster startup, less safety margin
  
  # --- Storage Management ---
  cleanup_displayed_frames: true   # Delete after display. REQUIRED for 24/7 operation
  max_output_frames: 100           # Legacy cleanup (ignored if cleanup_displayed_frames=true)

# ═══════════════════════════════════════════════════════════════════════════════
# FRESH GENERATION - Infinite generation system (Phase 1-5)
# ═══════════════════════════════════════════════════════════════════════════════
fresh_generation:
  enabled: true                     # Use CombinatorialPromptSystem when templates exist
  
  denoising:
    drift: 0.20                     # Normal operation (same prompt, gradual evolution)
    bend: 0.50                      # Prompt transition (higher denoise for visual "bend")
    bend_frames: 4                  # Frames at high denoise after mutation
  
  mutation:
    base_probability: 0.12          # Chance to mutate on each keyframe
    staleness_threshold: 25         # Force mutation after N frames without change
    category_weights:               # Probability weights for category selection
      color_logic: 0.35
      atmosphere_field: 0.25
      light_behavior: 0.20
      temporal_state: 0.15
      texture_density: 0.05
    similarity_target: 0.55         # Target similarity for component selection
    similarity_range: 0.25          # Acceptable range around target

# ═══════════════════════════════════════════════════════════════════════════════
# PROMPTS - Legacy generation guidance (used when fresh_generation disabled)
# ═══════════════════════════════════════════════════════════════════════════════
prompts:
  theme_pairs:
    - positive: "black, white, ethereal digital angel, dissolving into particles, flowing white lines, technical wireframe overlay, monochrome, sparse color accents, architectural diagrams, high contrast, abstract geometry"
      negative: "colors, red, blue, green, yellow, orange, purple, pink, brown, low quality, text, watermark, signature, jpeg artifacts, muddy colors, brown tones, warm colors"
    
    - positive: "abstract geometry, technical wireframe, architectural diagrams, flowing lines, blueprint aesthetic, monochrome with data corruption, cyberpunk overlay, grid patterns, high contrast"
      negative: "organic forms, curves, nature, soft edges, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, muddy colors"
    
    - positive: "cyberpunk angel, glitch art aesthetic, digital corruption, technical overlay, particle dissolution, monochrome with red and cyan accents, wireframe structure, abstract form, high contrast"
      negative: "smooth, clean, pristine, perfect, polished, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, natural lighting"
    
    - positive: "black, white, ethereal figure in data stream, technical readouts, flowing particles, architectural wireframe, monochrome with blue highlights, digital dissolution, abstract geometry, high contrast"
      negative: "solid forms, static, stable, grounded, physical, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, warm colors"
  
  modifiers:
    enabled: true
    time_based: true              # Add time-of-day atmosphere (dawn/day/dusk/night)
    system_based: false           # Future: CPU load affects prompt
  
  rotation_interval: 20           # Keyframes before switching theme. ↑ = longer per theme

# ═══════════════════════════════════════════════════════════════════════════════
# GAME DETECTION - Auto-pause for gaming
# ═══════════════════════════════════════════════════════════════════════════════
game_detection:
  enabled: true
  method: "process"               # "process" (reliable) | "fullscreen" (Windows only)
  check_interval: 5.0             # Seconds between checks. ↓ = more responsive
  
  known_games:                    # Add your game executables here (case-insensitive)
    - "eldenring.exe"
    - "cyberpunk2077.exe"
  
  gpu_threshold: 80               # For future gpu_load method

# ═══════════════════════════════════════════════════════════════════════════════
# PERFORMANCE - System tuning
# ═══════════════════════════════════════════════════════════════════════════════
performance:
  max_queue_size: 60              # Frame queue capacity. ↑ = more buffering, more RAM
  generation_timeout: 180         # Seconds before timeout. ↓ for modern GPU, ↑ for old GPU
  enable_torch_compile: false     # PyTorch 2.0 opt. Requires Volta+ GPU (RTX 20+)
  async_file_operations: true     # Non-blocking writes. Keep true

# ═══════════════════════════════════════════════════════════════════════════════
# DAEMON - Process management service
# ═══════════════════════════════════════════════════════════════════════════════
daemon:
  enabled: true
  
  comfyui:
    startup_script: "diffusion/ComfyUI/run_nvidia_gpu_gpu1_fast.bat"  # Your ComfyUI launch script
    startup_timeout: 300          # Max wait for ComfyUI (large models take time)
    health_check_url: "http://127.0.0.1:8188/system_stats"
    health_check_interval: 2
  
  controller:
    python_executable: ".venv/Scripts/python.exe"  # "auto" | explicit path
    main_script: "backend/main.py"
  
  auto_restart:
    comfyui: true
    controller: true
    max_restarts: 5               # Per hour, then give up
    restart_delay: 10             # Seconds before retry
  
  control_file: "output/daemon_control.txt"   # Write "pause"/"resume"/"shutdown" here
  control_check_interval: 2
  
  pid_file: "output/daemon.pid"
  status_update_interval: 5
  
  shutdown:
    comfyui_grace_period: 30      # Seconds for clean ComfyUI exit
    controller_grace_period: 10
    force_kill_after_timeout: true
  
  log_file: "logs/daemon.log"
  log_level: "INFO"

# ═══════════════════════════════════════════════════════════════════════════════
# CLOUD - Optional VPS deployment
# ═══════════════════════════════════════════════════════════════════════════════
# Additive mode: local Rainmeter continues working + frames push to VPS
cloud:
  enabled: false
  
  vps_websocket_url: "wss://aetherawi.red/ws/gpu"
  auth_token: null                # Or set DREAM_GEN_AUTH_TOKEN env var
  
  frame_push:
    enabled: true
    format: "webp"                # "webp" (small, ~50KB) | "png" (lossless, ~200KB)
    quality: 85                   # WebP quality 1-100. 85 = good balance
    include_interpolations: true  # false = keyframes only (less bandwidth)
  
  state_sync:
    enabled: true
    interval_keyframes: 10        # Push state every N keyframes
    push_on_shutdown: true
  
  resolution_override: [1024, 512]  # null = use generation.resolution
  
  connection:
    reconnect_delay: 1.0          # Initial delay
    max_reconnect_delay: 60.0     # Exponential backoff cap
    heartbeat_interval: 30.0
