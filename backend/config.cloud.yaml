# Dream Window Cloud Configuration
# ================================
# Optimized for RunPod Serverless deployment.
# Matches structure of config.yaml exactly.

system:
  comfyui_url: "http://127.0.0.1:8188"
  output_dir: "/app/output"
  cache_dir: "/app/cache"
  seed_dir: "/app/seeds"
  log_dir: "/app/logs"
  gpu_id: 0
  log_level: "INFO"

generation:
  use_async_orchestrator: true
  model: "sd15"
  
  # Cloud resolution - higher for web viewing
  # NOTE: This is the BASE resolution. cloud.resolution_override takes precedence.
  resolution: [1024, 512]
  
  mode: "hybrid"
  
  # SD 1.5 parameters
  sd:
    steps: 12                 # Balance speed vs quality
    cfg_scale: 6.0
    sampler: "euler"
    scheduler: "karras"
  
  # Hybrid mode - optimized for streaming
  hybrid:
    # PERFORMANCE TUNING:
    # - VAE decode: ~230ms/frame at 1024x512
    # - WebP encode: ~100ms/frame
    # - Target: ~5 FPS effective (more achievable with current hardware)
    
    # Reduced from 20 to 10 for better performance
    # 10 frames still provides smooth interpolation
    interpolation_frames: 10
    
    # Target 5 FPS display rate (realistic for 1024x512 + VAE decode)
    target_interpolation_fps: 5.0
    
    # Denoise strength for keyframes
    keyframe_denoise: 0.20
    
    # Full resolution interpolation
    interpolation_resolution_divisor: 1
    interpolation_upscale_method: "bilinear"
    interpolation_downsample_method: "bicubic"
    
    # GPU-accelerated slerp: Run spherical lerp on GPU instead of CPU thread pool
    gpu_slerp: true
  
  # img2img parameters
  img2img:
    denoise: 0.3
  
  # Cache system - larger for cloud
  cache:
    max_size: 100                   # Larger cache
    
    similarity_method: "dual_metric"
    population_mode: "selective"
    cache_interpolations: true
    cache_diversity_logic: "all"
    
    # Color histogram settings
    color_histogram:
      bins_per_channel: 32
      diversity_threshold: 1.92
      dissimilarity_range: [1.18, 2.05]
      convergence_threshold: 0.15
      force_cache_threshold: 0.30
    
    # Perceptual hash settings
    phash:
      hash_size: 8
      diversity_threshold: 0.80
      dissimilarity_range: [0.68, 0.92]
      convergence_threshold: 0.08
      force_cache_threshold: 0.15
    
    injection_logic: "any"
    injection_mode: "dissimilar"
    injection_probability: 0.15
    blend_weight: 0.75
    
    injection_cooldown: 2
    seed_injection_cooldown: 2
    embedding_history_reset: "partial"
    embedding_history_keep_recent: 10
    
    collapse_detection: true
    warmup_keyframes: 10
    convergence_mode: "absolute"
    log_convergence_stats: true
    
    seed_injection_floor: 0.02
    seed_injection_max: 0.15
    seed_injection_ramp: 50
    seed_injection_boost_threshold: 10
    seed_injection_boost_probability: 0.20
    force_seed_injection_frequency: 0.30
    blend_seed_injection: true
    seed_blend_weight: 0.85
    
    log_diversity_stats: true
    diversity_check_interval: 10
    
    advanced_monitoring:
      enabled: false
      eviction_strategy: "lru"
      acceptance_logic: "average"
      diversity_matrix_refresh: 50

# Display settings - at root level, not under generation!
display:
  # Buffer sizing for cloud:
  # At 10 FPS with 20 interp frames per keyframe (~2s generation):
  # - Each keyframe cycle = 21 frames = 2.1s of content
  # - Generation takes ~2s per keyframe + ~4s for 20 interps = ~6s per cycle
  # - So we produce 2.1s of content every 6s (ratio ~0.35)
  # - Buffer should be modest to avoid long initial waits
  buffer_target_seconds: 60.0       # 60 seconds of buffer (target)
  min_buffer_seconds: 10.0           # 10 seconds minimum before playback starts
  
  cleanup_displayed_frames: true
  max_output_frames: 200            # Keep more frames in memory for cloud

# Prompts - same as default
prompts:
  theme_pairs:
    - positive: "black, white, ethereal digital angel, dissolving into particles, flowing white lines, technical wireframe overlay, monochrome, sparse color accents, architectural diagrams, high contrast, abstract geometry"
      negative: "colors, red, blue, green, yellow, orange, purple, pink, brown, low quality, text, watermark, signature, jpeg artifacts, muddy colors, brown tones, warm colors"
    - positive: "abstract geometry, technical wireframe, architectural diagrams, flowing lines, blueprint aesthetic, monochrome with data corruption, cyberpunk overlay, grid patterns, high contrast"
      negative: "organic forms, curves, nature, soft edges, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, muddy colors"
    - positive: "cyberpunk angel, glitch art aesthetic, digital corruption, technical overlay, particle dissolution, monochrome with red and cyan accents, wireframe structure, abstract form, high contrast"
      negative: "smooth, clean, pristine, perfect, polished, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, natural lighting"
    - positive: "black, white, ethereal figure in data stream, technical readouts, flowing particles, architectural wireframe, monochrome with blue highlights, digital dissolution, abstract geometry, high contrast"
      negative: "solid forms, static, stable, grounded, physical, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, warm colors"
  
  modifiers:
    enabled: true
    time_based: true
    system_based: false
  
  rotation_interval: 20

# Disable game detection on cloud
game_detection:
  enabled: false

# Performance - tuned for cloud GPU
performance:
  max_queue_size: 100             # Larger queue for cloud
  generation_timeout: 180
  enable_torch_compile: false
  async_file_operations: true

# Daemon disabled on cloud (runpod_handler manages lifecycle)
daemon:
  enabled: false

# Cloud mode - ENABLED and configured
cloud:
  enabled: true
  
  # VPS WebSocket endpoint (can be overridden by VPS_WEBSOCKET_URL env var)
  vps_websocket_url: "wss://aetherawi.red/ws/gpu"
  
  # Auth token from environment
  auth_token: null  # Read from DREAM_GEN_AUTH_TOKEN env var
  
  # Frame pushing
  frame_push:
    enabled: true
    format: "jpeg"           # JPEG is much faster than WebP (~10ms vs ~100ms)
    quality: 80              # Good quality/size balance for streaming
    include_interpolations: true
  
  # State sync
  state_sync:
    enabled: true
    interval_keyframes: 10
    push_on_shutdown: true
  
  # Resolution override - THIS takes precedence over generation.resolution
  resolution_override: [1024, 512]
  
  # Connection settings
  connection:
    reconnect_delay: 1.0
    max_reconnect_delay: 60.0
    heartbeat_interval: 30.0
