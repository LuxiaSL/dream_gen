# Dream Window — B200 Direct Backend Configuration
# =================================================
# For Heimdall always-on service on dedicated B200 GPU.
# No ComfyUI, no RunPod. Direct diffusers pipeline.
#
# Pacing tuned for ~6-7 FPS keyframes (3x faster than RunPod).
# All cooldowns/thresholds scaled accordingly for slow, dreamy evolution.

system:
  backend: "direct"               # Direct diffusers — no ComfyUI needed
  output_dir: "./output"
  cache_dir: "./cache"
  log_dir: "./logs"
  gpu_id: 0                       # Heimdall sets CUDA_VISIBLE_DEVICES
  log_level: "INFO"

generation:
  use_async_orchestrator: true
  model: "sd15"
  resolution: [1024, 512]
  mode: "hybrid"

  sd:
    steps: 10
    cfg_scale: 7.0                # was 8.0 — slightly lower for dreamier output
    sampler: "euler"
    scheduler: "karras"

  hybrid:
    interpolation_frames: 20
    target_interpolation_fps: 20.0
    keyframe_denoise: 0.15
    interpolation_decoder: "vae"       # "vae" (full quality) or "taesd" (~2x faster, slightly softer)
    interpolation_resolution_divisor: 1
    interpolation_upscale_method: "bilinear"
    interpolation_downsample_method: "bicubic"
    gpu_slerp: true

  img2img:
    denoise: 0.25                 # was 0.3

  cache:
    max_size: 100
    similarity_method: "dual_metric"
    population_mode: "selective"
    cache_interpolations: true
    cache_diversity_logic: "all"

    color_histogram:
      bins_per_channel: 32
      diversity_threshold: 1.92
      dissimilarity_range: [1.18, 2.05]
      convergence_threshold: 0.15
      force_cache_threshold: 0.30

    phash:
      hash_size: 8
      diversity_threshold: 0.80
      dissimilarity_range: [0.68, 0.92]
      convergence_threshold: 0.08
      force_cache_threshold: 0.15

    injection_logic: "any"
    injection_mode: "dissimilar"
    injection_probability: 0.08   # was 0.15 — less random injection at higher keyframe rate
    blend_weight: 0.75
    injection_cooldown: 15        # was 5 — at most every ~2.5 seconds
    seed_injection_cooldown: 15   # was 5
    embedding_history_reset: "partial"
    embedding_history_keep_recent: 10

    collapse_detection: true
    warmup_keyframes: 30          # was 10 — establish baseline before detecting
    convergence_mode: "absolute"
    log_convergence_stats: true

    seed_injection_floor: 0.01    # was 0.02
    seed_injection_max: 0.08      # was 0.15
    seed_injection_ramp: 100      # was 50
    seed_injection_boost_threshold: 10
    seed_injection_boost_probability: 0.10  # was 0.20
    force_seed_injection_frequency: 0.30
    blend_seed_injection: true
    seed_blend_weight: 0.85

    log_diversity_stats: true
    diversity_check_interval: 25  # was 10

    advanced_monitoring:
      enabled: false

fresh_generation:
  enabled: true

  denoising:
    drift: 0.10                   # was 0.15 — slower evolution per keyframe
    bend: 0.35                    # was 0.45 — less dramatic mutations
    bend_frames: 8                # was 5 — longer transition period

  mutation:
    base_probability: 0.04        # was 0.12 — ~1 mutation per 25 keyframes (~4 seconds)
    staleness_threshold: 75       # was 25 — forced mutation every ~12 seconds
    category_weights:
      color_logic: 0.35
      atmosphere_field: 0.25
      light_behavior: 0.20
      temporal_state: 0.15
      texture_density: 0.05
    similarity_target: 0.55
    similarity_range: 0.25

display:
  buffer_target_seconds: 60.0
  min_buffer_seconds: 10.0
  cleanup_displayed_frames: true
  max_output_frames: 400

prompts:
  theme_pairs:
    - positive: "black, white, ethereal digital angel, dissolving into particles, flowing white lines, technical wireframe overlay, monochrome, sparse color accents, architectural diagrams, high contrast, abstract geometry"
      negative: "colors, red, blue, green, yellow, orange, purple, pink, brown, low quality, text, watermark, signature, jpeg artifacts, muddy colors, brown tones, warm colors"
    - positive: "abstract geometry, technical wireframe, architectural diagrams, flowing lines, blueprint aesthetic, monochrome with data corruption, cyberpunk overlay, grid patterns, high contrast"
      negative: "organic forms, curves, nature, soft edges, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, muddy colors"
    - positive: "cyberpunk angel, glitch art aesthetic, digital corruption, technical overlay, particle dissolution, monochrome with red and cyan accents, wireframe structure, abstract form, high contrast"
      negative: "smooth, clean, pristine, perfect, polished, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, natural lighting"
    - positive: "black, white, ethereal figure in data stream, technical readouts, flowing particles, architectural wireframe, monochrome with blue highlights, digital dissolution, abstract geometry, high contrast"
      negative: "solid forms, static, stable, grounded, physical, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, warm colors"

  modifiers:
    enabled: true
    time_based: true
    system_based: false

  rotation_interval: 100          # was 40 — longer per theme at higher keyframe rate

game_detection:
  enabled: false

performance:
  max_queue_size: 100
  generation_timeout: 60
  enable_torch_compile: false     # Disabled: dynamo tracing overhead > benefit at 2-3 UNet steps
  max_generation_fps: null
  async_file_operations: true

daemon:
  enabled: false

cloud:
  enabled: true
  vps_websocket_url: "wss://aetherawi.red/ws/gpu"
  auth_token: null                # Set via DREAM_GEN_AUTH_TOKEN env var

  frame_push:
    enabled: true
    format: "jpeg"
    quality: 80
    include_interpolations: true

  state_sync:
    enabled: true
    interval_keyframes: 10
    push_on_shutdown: true

  resolution_override: null       # Use generation.resolution

  connection:
    reconnect_delay: 1.0
    max_reconnect_delay: 60.0
    heartbeat_interval: 30.0
