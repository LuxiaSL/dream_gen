# Dream Window — B200 Direct Backend Configuration
# =================================================
# For Heimdall always-on service on dedicated B200 GPU.
# No ComfyUI. Direct diffusers pipeline.
#
# Pacing tuned for ~6-7 FPS keyframes.
# All cooldowns/thresholds scaled accordingly for slow, dreamy evolution.

system:
  backend: "direct"               # Direct diffusers — no ComfyUI needed
  output_dir: "./output"
  cache_dir: "./cache"
  log_dir: "./logs"
  gpu_id: 0                       # Default device (backward compat)
  gpu_devices:                    # Multi-GPU: pipeline overlap
    unet: 0                       # Keyframe generation (UNet + scheduler)
    vae: 1                        # VAE encode/decode (interpolation)
  log_level: "INFO"

generation:
  use_async_orchestrator: true
  model: "sd15"
  resolution: [1024, 512]
  mode: "hybrid"

  sd:
    steps: 10
    cfg_scale: 7.0                # was 8.0 — slightly lower for dreamier output
    sampler: "euler"
    scheduler: "karras"

  hybrid:
    interpolation_frames: 20
    injection_interpolation_frames: 150  # ~5s at 30fps �� smooth transitions for cache/seed/template swaps
    target_interpolation_fps: 30.0
    keyframe_denoise: 0.15
    interpolation_decoder: "vae"       # "vae" (full quality) or "taesd" (~2x faster, slightly softer)
    interpolation_resolution_divisor: 1
    interpolation_upscale_method: "bilinear"
    interpolation_downsample_method: "bicubic"
    gpu_slerp: true
    # Display keyframes as their VAE round-trip so they match neighboring
    # interp frames (kills the 7.5x per-keyframe sharpness pop, 2026-07-18).
    keyframe_display_roundtrip: true

  img2img:
    denoise: 0.25                 # was 0.3

  cache:
    max_size: 100
    similarity_method: "dual_metric"
    population_mode: "selective"
    cache_interpolations: true
    cache_diversity_logic: "all"

    color_histogram:
      bins_per_channel: 32
      diversity_threshold: 1.92
      dissimilarity_range: [1.18, 2.05]
      convergence_threshold: 0.15
      force_cache_threshold: 0.30

    phash:
      hash_size: 8
      diversity_threshold: 0.80
      dissimilarity_range: [0.68, 0.92]
      convergence_threshold: 0.08
      force_cache_threshold: 0.15

    # Latent-gated admission + selection (cache/latent_pool.py, 2026-07-19).
    # Pooled VAE-latent cosine distance replaces colorhist/phash for cache
    # decisions (the metric audit showed they can't rank within-motif).
    # min_dist: admit/inject only if >= this far from nearest cache entry.
    # min_interval_kf: metric-free floor — at most one admission per N kf.
    latent_admission:
      enabled: true
      min_dist: 0.20          # was 0.10 — admission must mean visually different
      min_interval_kf: 12
      min_interval_s: 8.0     # wall-clock floor; also covers kf-less submissions
      latent_wait_s: 4.0

    # Self-regulating cache: eviction removes the older member of the
    # closest latent pair (cache converges to a maximally spread set);
    # TTL expiry keeps it tracking recent history instead of fossilizing.
    self_regulation:
      eviction: "redundancy"
      entry_ttl_minutes: 240

    injection_logic: "any"
    injection_mode: "dissimilar"
    injection_probability: 0.08   # was 0.15 — less random injection at higher keyframe rate
    blend_weight: 0.35            # cached frame suggests (~1/3); anchor promotion makes it durable anyway
    injection_cooldown: 15        # was 5 — at most every ~2.5 seconds
    seed_injection_cooldown: 15   # was 5
    embedding_history_reset: "partial"
    embedding_history_keep_recent: 10

    collapse_detection: true
    warmup_keyframes: 30          # was 10 — establish baseline before detecting
    convergence_mode: "absolute"
    log_convergence_stats: true

    seed_injection_floor: 0.01    # was 0.02
    seed_injection_max: 0.08      # was 0.15
    seed_injection_ramp: 100      # was 50
    seed_injection_boost_threshold: 10
    seed_injection_boost_probability: 0.10  # was 0.20
    force_seed_injection_frequency: 0.30
    blend_seed_injection: true
    seed_blend_weight: 0.70       # was 0.85 — swap keeps anti-collapse teeth but leaves era residue visible

    log_diversity_stats: true
    diversity_check_interval: 25  # was 10

    # Simple frame-counting bypass — replaces adaptive detection
    # Modulo operates on KEYFRAME count (~1.27 kf/s measured steady-state).
    # Era-development tuning 2026-07-18: mutation/bend is the sole engine of
    # change; injections/swaps are rare punctuation. Invariant:
    # mutation_interval - bend_frames = settle time, must stay > 0.
    manual_bypass:
      enabled: true
      mutation_interval: 16         # was 8 — ~12.6s: 8 kf bend + 8 kf settle
      cache_injection_interval: 48  # ~38s — collapse counter-move (was 120; cache worker was dead until 2026-07-19)
      template_swap_interval: 1000  # was 72 — ~13 min, this IS the era scale
      cache_injection_lockout_after_swap: 96  # fresh era accumulates before recall can pull backward

    advanced_monitoring:
      enabled: false

fresh_generation:
  enabled: true

  # Anchor walking (SPEC-anchor.md): the lineage advances anchor->anchor at
  # bend denoise; drift frames chain locally from each anchor and are
  # discarded from the lineage at the next mutation. Mush cannot compound.
  anchor_walking:
    enabled: true
    mutation_interpolation_frames: 60   # ~2s glide across each re-anchor jump
    noise_pinning: true                 # era-deterministic, per-frame varied (era_seed + kf)
    hygiene_min_mass_ratio: 0.5         # refuse mutation-promotions this much emptier
                                        # than the current anchor (0 = off); swaps and
                                        # injections always anchor

  denoising:
    drift: 0.18                   # local orbit around the anchor
    bend: 0.60                    # re-anchor strength: components genuinely restructure
    bend_frames: 8                # legacy chained mode only; ignored under anchor_walking

  mutation:
    base_probability: 0.04        # was 0.12 — ~1 mutation per 25 keyframes (~4 seconds)
    staleness_threshold: 75       # was 25 — forced mutation every ~12 seconds
    category_weights:
      color_logic: 0.35
      atmosphere_field: 0.25
      light_behavior: 0.20
      temporal_state: 0.15
      texture_density: 0.05
    similarity_target: 0.50       # was 0.55 — slightly more distant word choices per mutation
    similarity_range: 0.25

display:
  buffer_target_seconds: 60.0
  min_buffer_seconds: 10.0
  cleanup_displayed_frames: true
  max_output_frames: 400

prompts:
  theme_pairs:
    - positive: "black, white, ethereal digital angel, dissolving into particles, flowing white lines, technical wireframe overlay, monochrome, sparse color accents, architectural diagrams, high contrast, abstract geometry"
      negative: "colors, red, blue, green, yellow, orange, purple, pink, brown, low quality, text, watermark, signature, jpeg artifacts, muddy colors, brown tones, warm colors"
    - positive: "abstract geometry, technical wireframe, architectural diagrams, flowing lines, blueprint aesthetic, monochrome with data corruption, cyberpunk overlay, grid patterns, high contrast"
      negative: "organic forms, curves, nature, soft edges, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, muddy colors"
    - positive: "cyberpunk angel, glitch art aesthetic, digital corruption, technical overlay, particle dissolution, monochrome with red and cyan accents, wireframe structure, abstract form, high contrast"
      negative: "smooth, clean, pristine, perfect, polished, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, natural lighting"
    - positive: "black, white, ethereal figure in data stream, technical readouts, flowing particles, architectural wireframe, monochrome with blue highlights, digital dissolution, abstract geometry, high contrast"
      negative: "solid forms, static, stable, grounded, physical, blur, low quality, text, watermark, signature, jpeg artifacts, low contrast, warm colors"

  modifiers:
    enabled: true
    time_based: true
    system_based: false

  rotation_interval: 100          # was 40 — longer per theme at higher keyframe rate

game_detection:
  enabled: false

performance:
  max_queue_size: 100
  generation_timeout: 60
  enable_torch_compile: false     # Tested: dynamo overhead > benefit at 10 UNet steps on B200
  max_generation_fps: null
  async_file_operations: true

daemon:
  enabled: false

cloud:
  enabled: true
  vps_websocket_url: "wss://aetherawi.red/ws/gpu"
  auth_token: null                # Set via DREAM_GEN_AUTH_TOKEN env var

  frame_push:
    enabled: true
    include_interpolations: true

    # H.264 encoding options
    h264:
      keyframe_interval: 60   # I-frame every ~2s (30fps * 2)
      crf: 18                 # Quality: 18=high, 23=medium, 28=low
      max_bitrate: "4M"       # Bandwidth cap for spikes during mutations
      preset: "veryfast"      # Good quality/speed tradeoff — 128 cores at 7% util

  state_sync:
    enabled: true
    interval_keyframes: 10
    push_on_shutdown: true

  resolution_override: null       # Use generation.resolution

  connection:
    reconnect_delay: 1.0
    max_reconnect_delay: 60.0
    heartbeat_interval: 30.0

# ═══════════════════════════════════════════════════════════════════
# CHRONICLE - the dream's own memory (SPEC-chronicle.md)
# Per-keyframe records + tiered thumbnails pushed to the VPS (0x05).
# Fire-and-forget: disabling this or any chronicle failure never
# affects generation.
# ═══════════════════════════════════════════════════════════════════
chronicle:
  enabled: true
  thumbnail_interval_s: 30     # scheduled thumbnail cadence (events always get one)
  flush_interval_s: 5          # batch flush cadence
  flush_max_records: 50        # ...or when this many records accumulate
  thumbnail_size: [256, 128]
  webp_quality: 70
  max_queue: 200               # work queue bound (drop-oldest beyond this)

# ═══════════════════════════════════════════════════════════════════
# RESUME - the dream picks up where it left off (SPEC-resume.md)
# Local checkpoint (output/resume/) with last keyframe + prompt state
# + lifetime counters. Invalid/missing checkpoint -> clean fresh start.
# ═══════════════════════════════════════════════════════════════════
resume:
  enabled: true
  checkpoint_interval_keyframes: 50   # ~40s at current keyframe rate
