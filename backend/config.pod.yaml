# Dream Window Pod Testing Configuration
# ======================================
# For RunPod pod development/testing with SSH access
# Uses /workspace paths instead of Docker /app paths

system:
  comfyui_url: "http://127.0.0.1:8188"
  output_dir: "/workspace/output"
  cache_dir: "/workspace/cache"
  seed_dir: "/workspace/dream_gen/seeds"
  log_dir: "/workspace/logs"
  gpu_id: 0
  log_level: "INFO"  # Console shows INFO+, file gets everything

generation:
  use_async_orchestrator: true
  model: "sd15"
  
  # Lower resolution for faster iteration during testing
  resolution: [1024, 512]
  
  mode: "hybrid"
  
  # SD 1.5 parameters
  sd:
    steps: 15                  # Faster for testing
    cfg_scale: 8.0
    sampler: "euler"
    scheduler: "karras"
  
  # Hybrid mode settings
  hybrid:
    interpolation_frames: 15    # Fewer frames for faster cycles
    target_interpolation_fps: 5.0
    keyframe_denoise: 0.2     # Lower for testing DRIFT mode
    interpolation_resolution_divisor: 1
    interpolation_upscale_method: "bilinear"
    interpolation_downsample_method: "bicubic"
    gpu_slerp: true
  
  # Cache system
  cache:
    max_size: 100
    similarity_method: "dual_metric"
    population_mode: "selective"
    cache_interpolations: true
    cache_diversity_logic: "all"
    
    color_histogram:
      bins_per_channel: 32
      diversity_threshold: 1.92
      dissimilarity_range: [1.18, 2.05]
      convergence_threshold: 0.15
      force_cache_threshold: 0.30
    
    phash:
      hash_size: 8
      diversity_threshold: 0.80
      dissimilarity_range: [0.68, 0.92]
      convergence_threshold: 0.08
      force_cache_threshold: 0.15
    
    injection_logic: "any"
    injection_mode: "dissimilar"
    injection_probability: 0.15
    blend_weight: 0.75
    injection_cooldown: 5
    seed_injection_cooldown: 10
    embedding_history_reset: "partial"
    embedding_history_keep_recent: 20
    
    # Collapse detection - template-aware settings
    collapse_detection: true
    warmup_keyframes: 100       # Shorter warmup for testing
    collapse_history_size: 50
    collapse_detection_window: 25
    collapse_baseline_comparison: true
    convergence_mode: "absolute"
    log_convergence_stats: true
    
    seed_injection_floor: 0.02
    seed_injection_max: 0.15
    seed_injection_ramp: 30
    seed_injection_boost_threshold: 5
    seed_injection_boost_probability: 0.20
    force_seed_injection_frequency: 0.30
    blend_seed_injection: true
    seed_blend_weight: 0.85
    
    log_diversity_stats: true
    diversity_check_interval: 5

# === FRESH GENERATION - Infinite generation system ===
fresh_generation:
  enabled: true
  
  denoising:
    drift: 0.20                # Normal operation (same prompt)
    bend: 0.70                 # Prompt transition (higher denoise)
    bend_frames: 5             # Frames at high denoise after mutation
  
  mutation:
    base_probability: 0.15     # Slightly higher for testing (more mutations)
    staleness_threshold: 20    # Force mutation after N frames
    category_weights:
      color_logic: 0.30
      atmosphere_field: 0.25
      light_behavior: 0.20
      temporal_state: 0.15
      texture_density: 0.10
    similarity_target: 0.55
    similarity_range: 0.25

display:
  buffer_target_seconds: 20.0   # Shorter buffer for testing
  min_buffer_seconds: 5.0
  cleanup_displayed_frames: true
  max_output_frames: 200

prompts:
  # Legacy prompts (not used when CombinatorialPromptSystem is active)
  theme_pairs:
    - positive: "ethereal digital form, flowing particles, monochrome with color accents"
      negative: "low quality, blurry, text, watermark"
  modifiers:
    enabled: false
    time_based: false
    system_based: false
  rotation_interval: 20

game_detection:
  enabled: false

performance:
  max_queue_size: 50
  generation_timeout: 120
  enable_torch_compile: false
  async_file_operations: true

daemon:
  enabled: false

# Cloud mode - can connect to VPS for visual feedback
cloud:
  enabled: false  # Set to true to stream to aetherawi.red/dreams
  vps_websocket_url: "wss://aetherawi.red/ws/gpu"
  auth_token: null  # Set via DREAM_GEN_AUTH_TOKEN env var
  
  frame_push:
    enabled: true
    format: "jpeg"
    quality: 80
    include_interpolations: true
  
  state_sync:
    enabled: true
    interval_keyframes: 10
    push_on_shutdown: true
  
  resolution_override: null  # Use generation.resolution
  
  connection:
    reconnect_delay: 1.0
    max_reconnect_delay: 60.0
    heartbeat_interval: 30.0

