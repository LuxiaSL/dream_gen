[Rainmeter]
Update=1000
Author=Claude (Rebuilt for Luxia)
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh] 
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh] 
LeftMouseDoubleClickAction=!ToggleConfig "Mond\Settings" "Settings.ini"

[Metadata]
Name=Mond Weather (OpenWeatherMap)
Author=Claude
Information=Weather widget using OpenWeatherMap API
License=
Version=2.0

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\Language.inc
Scale=1.25

; ============================================
; CONFIGURATION - EDIT THESE VALUES
; ============================================
; Get your free API key from: https://openweathermap.org/api
APIKey=c9f3b8f588e67ae5b21205c4e8974bd5
Latitude=37.79060230699391
Longitude=-122.41590508863851
; Your city name and country code (e.g., "San Francisco,US" or "London,GB")
; Or use coordinates: lat=37.7749&lon=-122.4194
City=lat=#Latitude#&lon=#Longitude#

; Temperature unit: imperial (Fahrenheit) or metric (Celsius)
Units=imperial

; Update every 15 minutes (900 seconds) - API limits: 1000 calls/day
UpdateRate=900

; ============================================
; COLOR SCHEME - Cool Technical (matches desktop)
; ============================================
; Soft cyan/blue accent (like the tech elements in your bg)
ColorCyan=120,180,220
; Cool light blue for temperature (replaces orange)
ColorCoolBlue=180,210,240
; Bright white for text
ColorWhite=240,240,245
; Muted gray-blue for secondary info
ColorMuted=160,170,180
; Darker muted for less important info
ColorMutedDark=120,130,140
; Subtle background for refresh button
ColorBgButton=40,45,50,150
; Error red
ColorError=255,100,100
; Success green
ColorSuccess=100,255,150

; ============================================
; MEASURES - API CALLS
; ============================================

[MeasureWeather]
Measure=Plugin
Plugin=WebParser
URL=https://api.openweathermap.org/data/2.5/weather?#City#&appid=#APIKey#&units=#Units#
RegExp=(?si)"weather":\[.*?"description":"([^"]+)".*?"icon":"([^"]+)".*?"main":\{.*?"temp":([0-9.]+).*?"feels_like":([0-9.]+).*?"humidity":([0-9]+).*?"name":"([^"]+)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeasure MeasureTemp][!UpdateMeasure MeasureFeelsLike][!UpdateMeasure MeasureCondition][!UpdateMeasure MeasureWeatherIcon][!UpdateMeasure MeasureHumidity][!UpdateMeasure MeasureLocation][!UpdateMeter *][!Redraw]

[MeasureCondition]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=1
DynamicVariables=1

[MeasureWeatherIcon]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=2
DynamicVariables=1
; Map OpenWeatherMap icon codes to your local icon names
Substitute="01d":"clear_day","01n":"clear_night","02d":"partly_cloudy_day","02n":"partly_cloudy_night","03d":"cloudy","03n":"cloudy","04d":"cloudy","04n":"cloudy","09d":"rain","09n":"rain","10d":"rain","10n":"rain","11d":"rain","11n":"rain","13d":"snow","13n":"snow","50d":"fog","50n":"fog"

[MeasureTemp]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=3
DynamicVariables=1

[MeasureFeelsLike]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=4
DynamicVariables=1

[MeasureHumidity]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=5
DynamicVariables=1

[MeasureLocation]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=6
DynamicVariables=1

; Current time for debug
[MeasureTime]
Measure=Time
Format=%I:%M %p
DynamicVariables=1

; Round temperature to integer
[MeasureTempRounded]
Measure=Calc
Formula=Round([MeasureTemp])
DynamicVariables=1
IfCondition=1
IfTrueAction=[!UpdateMeter MeterTemp][!Redraw]

; Round feels like temperature to integer
[MeasureFeelsLikeRounded]
Measure=Calc
Formula=Round([MeasureFeelsLike])
DynamicVariables=1

; ============================================
; METERS - DISPLAY
; ============================================

[MeterCurrentIcon]
Meter=Image
MeasureName=MeasureWeatherIcon
Path=#@#WeatherIcons\
ImageName=[MeasureWeatherIcon].png
X=(0*#Scale#)
Y=(20*#Scale#)
W=(150*#Scale#)
H=(150*#Scale#)
PreserveAspectRatio=1
AntiAlias=1
DynamicVariables=1
; Add cyan tint to icons (optional - remove ImageTint if you want original colors)
ImageTint=#ColorCyan#,180

[MeterLocation]
Meter=String
MeasureName=MeasureLocation
StringAlign=Left
StringCase=Upper
FontFace=Anurati
FontColor=#ColorWhite#
FontWeight=400
FontSize=(22*#Scale#)
X=(160*#Scale#)
Y=(20*#Scale#)
AntiAlias=1
DynamicVariables=1
; Show message when no data
Text=%1
DefaultValue="WAITING FOR DATA..."

[MeterCondition]
Meter=String
MeasureName=MeasureCondition
StringAlign=Left
StringCase=Upper
FontFace=Entanglement
FontWeight=600
FontColor=#ColorCyan#
FontSize=(13*#Scale#)
X=(160*#Scale#)
Y=(55*#Scale#)
AntiAlias=1
DynamicVariables=1
Text=%1
DefaultValue="---"

[MeterTemp]
Meter=String
MeasureName=MeasureTempRounded
StringAlign=Left
FontFace=Anurati
FontColor=#ColorCoolBlue#
FontWeight=400
FontSize=(36*#Scale#)
X=(160*#Scale#)
Y=(69*#Scale#)
W=(200*#Scale#)
; Use Rainmeter's character code escape for degree symbol to avoid Unicode issues
Text=%1[\176]F
DefaultValue="--[\176]F"
AntiAlias=1
DynamicVariables=1

[MeterFeelsLike]
Meter=String
MeasureName=MeasureFeelsLikeRounded
StringAlign=Left
FontFace=Quicksand
FontColor=#ColorMutedDark#
FontWeight=500
FontSize=(12*#Scale#)
X=(160*#Scale#)
Y=(130*#Scale#)
Text=FEELS LIKE %1[\176]F
AntiAlias=1
DynamicVariables=1

[MeterHumidity]
Meter=String
MeasureName=MeasureHumidity
StringAlign=Left
FontFace=Quicksand
FontColor=#ColorMuted#
FontWeight=500
FontSize=(12*#Scale#)
X=(160*#Scale#)
Y=(150*#Scale#)
Text=HUMIDITY: %1%
AntiAlias=1
DynamicVariables=1

; ============================================
; SPACING ADJUSTMENT GUIDE
; ============================================
; All measurements are multiplied by #Scale# (currently 1.25)
; 
; Element Positions (Y coordinates from top):
; - MeterCurrentIcon:   Y=0     (weather icon, left side)
; - MeterLocation:      Y=20    (city name, e.g., "SAN FRANCISCO")
; - MeterCondition:     Y=52    (condition text, e.g., "BROKEN CLOUDS")
; - MeterTemp:          Y=76    (main temperature, e.g., "55°F")
; - MeterFeelsLike:     Y=128   (feels like text)
; - MeterHumidity:      Y=148   (humidity text)
;
; To adjust spacing:
; - Change Y values (bigger = lower on screen)
; - Change FontSize for text size
; - Change X values to move left/right (160 = aligned with text column)
; - Icon size controlled by W and H in MeterCurrentIcon (currently 150x150)
;
; Colors defined in Variables section (lines 44-59)
; ============================================
