[Rainmeter]
Update=50
AccurateText=1
DynamicWindowSize=1
HardwareAcceleration=1

; ========================================
; DAEMON LIFECYCLE MANAGEMENT
; ========================================
; Launch daemon when skin loads
OnRefreshAction=[!CommandMeasure MeasureLaunchDaemon "Run"]
; Gracefully shutdown daemon when skin closes/unloads
OnCloseAction=[!CommandMeasure MeasureShutdownDaemon "Run"]

; ========================================
; METADATA
; ========================================
[Metadata]
Name=Dream Window
Author=Luxia & Claude
Information=AI-generated dream window with live status and autonomous daemon
Version=1.0.0
License=MIT

; ========================================
; VARIABLES
; ========================================
@Include=#@#Variables.inc

; ========================================
; DAEMON LAUNCHER
; ========================================

[MeasureLaunchDaemon]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-WindowStyle Hidden -ExecutionPolicy Bypass -NoProfile -File "#@#Scripts\launch_daemon.ps1" -ProjectPath "#ProjectPath#"
State=Hide
Timeout=15000
OutputType=ANSI
FinishAction=[!Log "Daemon launch completed"]
DynamicVariables=1

; ========================================
; DAEMON SHUTDOWN (Clean exit with uv support)
; ========================================

[MeasureShutdownDaemon]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-WindowStyle Hidden -ExecutionPolicy Bypass -NoProfile -File "#@#Scripts\shutdown_daemon.ps1" -ProjectPath "#ProjectPath#"
State=Hide
Timeout=65000
OutputType=ANSI
DynamicVariables=1

; ========================================
; STATUS FILE MONITORING (PARENT-CHILD DONE RIGHT)
; ========================================
; Like the working weather widget: ONE regex with multiple capture groups
; Children just pick their StringIndex number

[MeasureStatusFile]
Measure=Plugin
Plugin=WebParser
URL=file://#ProjectPath#\output\status.json
; BATTLE-TESTED REGEX - Uses [^}]* to avoid greedy issues, NO (?siU) flag needed
; This pattern correctly captures full numbers without truncation
RegExp="status"\s*:\s*"([^"]+)"[^}]*"frame_number"\s*:\s*(\d+)[^}]*"generation_time"\s*:\s*([\d.]+)[^}]*"current_mode"\s*:\s*"([^"]+)"[^}]*"uptime_hours"\s*:\s*([\d.]+)[^}]*"daemon_status"\s*:\s*"([^"]+)"[^}]*"comfyui_status"\s*:\s*"([^"]+)"
; Update every 2 cycles = 100ms (matches Python 10 FPS update rate)
UpdateRate=2
FinishAction=[!UpdateMeasure MeasureStatus][!UpdateMeasure MeasureFrameNumber][!UpdateMeasure MeasureGenTime][!UpdateMeasure MeasureMode][!UpdateMeasure MeasureUptime][!UpdateMeasure MeasureDaemonStatus][!UpdateMeasure MeasureComfyUIStatus][!UpdateMeasure MeasureLoadingText][!UpdateMeter *][!Redraw]
DynamicVariables=1

; ========================================
; STATUS VALUE PARSERS (CHILDREN GRAB STRINGINDEX)
; ========================================
; Each child just references the parent and picks its StringIndex

[MeasureStatus]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatusFile]
StringIndex=1
DynamicVariables=1

[MeasureFrameNumber]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatusFile]
StringIndex=2
DynamicVariables=1

[MeasureGenTime]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatusFile]
StringIndex=3
DynamicVariables=1

[MeasureMode]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatusFile]
StringIndex=4
DynamicVariables=1

[MeasureUptime]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatusFile]
StringIndex=5
DynamicVariables=1

[MeasureDaemonStatus]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatusFile]
StringIndex=6
FinishAction=[!UpdateMeasure MeasureDaemonStatusColor]
DynamicVariables=1

[MeasureComfyUIStatus]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatusFile]
StringIndex=7
DynamicVariables=1

; ========================================
; INITIALIZATION OVERLAY CONTROL
; ========================================
; Show overlay only when ComfyUI is starting or stopped
; Hide once it's running (frames will display when buffer is ready)

[MeasureLoadingText]
Measure=String
String=[MeasureComfyUIStatus]
IfMatch=^starting$
IfMatchAction=[!SetOption LoadingTextMeter Text "STARTING COMFYUI..."][!ShowMeterGroup LoadingOverlay][!UpdateMeter LoadingTextMeter][!Redraw]
IfMatch2=^stopped$
IfMatchAction2=[!SetOption LoadingTextMeter Text "INITIALIZING..."][!ShowMeterGroup LoadingOverlay][!UpdateMeter LoadingTextMeter][!Redraw]
IfMatch3=^ready$|^running$
IfMatchAction3=[!HideMeterGroup LoadingOverlay][!Redraw]
DynamicVariables=1

; ========================================
; FILE MONITORING (Images)
; ========================================
; UpdateDivider controls check frequency:
; - UpdateDivider=10 → 500ms (2 FPS max, current default)
; - UpdateDivider=2  → 100ms (10 FPS max, good for 15 FPS generation)
; - UpdateDivider=1  → 50ms (20 FPS max, good for 30 FPS generation)
; For >20 FPS: Lower [Rainmeter] Update value (e.g., Update=30)

[MeasureCurrentFrame]
Measure=Plugin
Plugin=FileView
Path=#ProjectPath#\output
Pattern=current_frame.png
ShowDotDot=0
ShowFolder=0
OnUpdateAction=[!CommandMeasure MeasureCurrentFrame "Update"][!UpdateMeter CurrentImage][!UpdateMeter PreviousImage][!CommandMeasure ActionTimerCrossfade "Execute 1"]
UpdateDivider=2
; ↑ Change this value to adjust frame check speed
;   Lower = faster checks = supports higher FPS
;   10 = 0.5s checks (default, safe)
;   2  = 0.1s checks (recommended for 15 FPS)
;   1  = 0.05s checks (recommended for 30 FPS)

; ========================================
; PULSING GLOW ANIMATION (SLOWER)
; ========================================

[MeasurePulse]
Measure=Calc
Formula=(sin(6.28318*((#UpdateRate#/1000)/(16000/1000))*Counter)+1)/2*255
DynamicVariables=1
UpdateDivider=1

; ========================================
; METERS - Background & Frame
; ========================================

[Background]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight#,8 | Fill Color #ColorBgDark# | StrokeWidth 0
AntiAlias=1

; ========================================
; HEADER
; ========================================

[HeaderText]
Meter=String
X=12
Y=6
FontFace=Consolas
FontSize=9
FontColor=#ColorCyanPrimary#
FontWeight=700
StringEffect=Shadow
FontEffectColor=0,0,0,180
Text=DREAM WINDOW
AntiAlias=1

; ========================================
; BORDER & CORNERS
; ========================================

[BorderOuter]
Meter=Shape
X=8
Y=32
Shape=Rectangle 0,0,#ViewportWidth#,#ViewportHeight#,0 | StrokeWidth 6 | Stroke Color #ColorCyanPrimary# | Fill Color 0,0,0,0
AntiAlias=1

[CornerTopLeft]
Meter=Shape
X=8
Y=32
Shape=Line 0,0,0,24 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
Shape2=Line 0,0,24,0 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
AntiAlias=1

[CornerTopRight]
Meter=Shape
X=(8+#ViewportWidth#)
Y=32
Shape=Line 0,0,0,24 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
Shape2=Line 0,0,-24,0 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
AntiAlias=1

[CornerBottomLeft]
Meter=Shape
X=8
Y=(32+#ViewportHeight#)
Shape=Line 0,0,0,-24 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
Shape2=Line 0,0,24,0 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
AntiAlias=1

[CornerBottomRight]
Meter=Shape
X=(8+#ViewportWidth#)
Y=(32+#ViewportHeight#)
Shape=Line 0,0,0,-24 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
Shape2=Line 0,0,-24,0 | StrokeWidth 3 | Stroke Color #ColorCyanPrimary#
AntiAlias=1

; ========================================
; PULSING GLOW (Inner Border - Subtle)
; ========================================

[InnerGlowDynamic]
Meter=Shape
X=11
Y=35
MeasureName=MeasurePulse
Shape=Rectangle 0,0,(#ViewportWidth#-6),(#ViewportHeight#-6),0 | StrokeWidth 2 | Stroke Color #ColorCyanSecondary#,[MeasurePulse] | Fill Color 0,0,0,0
AntiAlias=1
DynamicVariables=1

; ========================================
; IMAGE DISPLAY (Previous Frame)
; ========================================

[PreviousImage]
Meter=Image
X=11
Y=35
W=#ViewportWidth#
H=#ViewportHeight#
PreserveAspectRatio=1
ImageAlpha=0
ImageName=#ProjectPath#\output\current_frame.png
DynamicVariables=1

; ========================================
; IMAGE DISPLAY (Current Frame)
; ========================================

[CurrentImage]
Meter=Image
X=11
Y=35
W=#ViewportWidth#
H=#ViewportHeight#
PreserveAspectRatio=1
ImageAlpha=255
ImageName=#ProjectPath#\output\current_frame.png
DynamicVariables=1

; ========================================
; LOADING OVERLAY (Initialization Only)
; ========================================

[LoadingOverlayShape]
Meter=Shape
X=11
Y=35
Shape=Rectangle 0,0,#ViewportWidth#,#ViewportHeight# | Fill Color 0,0,0,200 | StrokeWidth 0
Group=LoadingOverlay
DynamicVariables=1

[LoadingTextMeter]
Meter=String
X=(11 + #ViewportWidth# / 2)
Y=(35 + #ViewportHeight# / 2 - 10)
FontFace=Consolas
FontSize=12
FontColor=#ColorCyanPrimary#
FontWeight=700
StringAlign=CenterCenter
StringEffect=Shadow
FontEffectColor=0,0,0,255
Text=INITIALIZING...
AntiAlias=1
Group=LoadingOverlay
DynamicVariables=1

; ========================================
; LOADING ANIMATION - Three Pulsing Dots
; ========================================

[MeasureDot1Alpha]
Measure=Calc
Formula=((Sin((Counter * 15) * (PI / 180)) + 1) / 2 * 255)
DynamicVariables=1

[MeasureDot2Alpha]
Measure=Calc
Formula=((Sin(((Counter * 15) + 120) * (PI / 180)) + 1) / 2 * 255)
DynamicVariables=1

[MeasureDot3Alpha]
Measure=Calc
Formula=((Sin(((Counter * 15) + 240) * (PI / 180)) + 1) / 2 * 255)
DynamicVariables=1

[LoadingDot1]
Meter=Shape
X=(11 + #ViewportWidth# / 2 - 15)
Y=(35 + #ViewportHeight# / 2 + 20)
Shape=Ellipse 0,0,4 | Fill Color #ColorCyanPrimary#,[MeasureDot1Alpha] | StrokeWidth 0
AntiAlias=1
Group=LoadingOverlay
DynamicVariables=1

[LoadingDot2]
Meter=Shape
X=(11 + #ViewportWidth# / 2)
Y=(35 + #ViewportHeight# / 2 + 20)
Shape=Ellipse 0,0,4 | Fill Color #ColorCyanPrimary#,[MeasureDot2Alpha] | StrokeWidth 0
AntiAlias=1
Group=LoadingOverlay
DynamicVariables=1

[LoadingDot3]
Meter=Shape
X=(11 + #ViewportWidth# / 2 + 15)
Y=(35 + #ViewportHeight# / 2 + 20)
Shape=Ellipse 0,0,4 | Fill Color #ColorCyanPrimary#,[MeasureDot3Alpha] | StrokeWidth 0
AntiAlias=1
Group=LoadingOverlay
DynamicVariables=1

; ========================================
; STATUS BAR
; ========================================

[StatusBackground]
Meter=Shape
X=8
Y=(32+#ViewportHeight#+8)
Shape=Rectangle 0,0,#ViewportWidth#,32,4 | Fill Color 0,0,0,180 | StrokeWidth 0
AntiAlias=1

[StatusTextFrame]
Meter=String
MeasureName=MeasureFrameNumber
X=16
Y=(32+#ViewportHeight#+12)
FontFace=Consolas
FontSize=8
FontColor=#ColorTextGray#
StringEffect=Shadow
FontEffectColor=0,0,0,200
Text=Frame #%1
AntiAlias=1
DynamicVariables=1

[StatusTextGenTime]
Meter=String
MeasureName=MeasureGenTime
X=16
Y=(32+#ViewportHeight#+24)
FontFace=Consolas
FontSize=7
FontColor=#ColorTextGray#
StringEffect=Shadow
FontEffectColor=0,0,0,200
Text=Diffusion: %1s
NumOfDecimals=2
AntiAlias=1
DynamicVariables=1

[StatusTextStatus]
Meter=String
MeasureName=MeasureStatus
X=(#ViewportWidth#-8)
Y=(32+#ViewportHeight#+12)
StringAlign=Right
FontFace=Consolas
FontSize=8
FontColor=#ColorCyanPrimary#
FontWeight=700
StringEffect=Shadow
FontEffectColor=0,0,0,200
Text=%1
StringCase=Upper
AntiAlias=1
DynamicVariables=1

[StatusTextUptime]
Meter=String
MeasureName=MeasureUptime
X=(#ViewportWidth#-8)
Y=(32+#ViewportHeight#+24)
StringAlign=Right
FontFace=Consolas
FontSize=7
FontColor=#ColorTextGray#
StringEffect=Shadow
FontEffectColor=0,0,0,200
Text=Up: %1h
NumOfDecimals=1
AntiAlias=1
DynamicVariables=1

; ========================================
; DAEMON STATUS INDICATOR
; ========================================

[MeasureDaemonStatusColor]
Measure=String
String=[MeasureDaemonStatus]
IfMatch=^running$
IfMatchAction=[!SetOption DaemonStatusDot FillColor "0,255,0,255"][!UpdateMeter DaemonStatusDot]
IfMatch2=^starting$
IfMatchAction2=[!SetOption DaemonStatusDot FillColor "255,255,0,255"][!UpdateMeter DaemonStatusDot]
IfMatch3=^stopping$
IfMatchAction3=[!SetOption DaemonStatusDot FillColor "255,128,0,255"][!UpdateMeter DaemonStatusDot]
IfNotMatchAction=[!SetOption DaemonStatusDot FillColor "255,0,0,255"][!UpdateMeter DaemonStatusDot]
DynamicVariables=1

[DaemonStatusDot]
Meter=Shape
X=(#WidgetWidth#-16)
Y=10
Shape=Ellipse 0,0,4 | StrokeWidth 0
FillColor=255,255,0,255
AntiAlias=1
DynamicVariables=1

